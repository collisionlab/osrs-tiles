name: insets

on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  push:
    branches: [main]
    paths: [scripts/**, data/inset-labels/**, src/main/java/mapstyle/InsetTopology.java]
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: inset-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: collisionlab/osrs-planner
          path: planner
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: collisionlab
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Current map assets pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/candidate
          cp planner/tiles.json work/pinned.json
          cp planner/tiles.json work/candidate/pin.json
          # An open pin PR can carry newer tiles from a publish run: build for those rather than
          # reverting the PR to main's tiles.
          if [ -n "$(gh pr list --repo collisionlab/osrs-planner --head pin/map-assets --state open --json number --jq '.[].number')" ]; then
            git -C planner fetch -q --depth 1 origin pin/map-assets
            git -C planner show FETCH_HEAD:tiles.json > work/open-pin.json
            if [ "$(jq -r .version work/open-pin.json)" != "$(jq -r .version work/pinned.json)" ] &&
               [ "$(jq -r '.version | split("-")[0] | tonumber' work/open-pin.json)" -ge "$(jq -r '.version | split("-")[0] | tonumber' work/pinned.json)" ]; then
              cp work/open-pin.json work/candidate/pin.json
            fi
          fi
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: tile-candidate
          path: work/candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Resolve cache
        id: cache
        run: |
          version=$(jq -r .version work/candidate/pin.json)
          cache_id=${version%%-*}
          echo "id=$cache_id" >> "$GITHUB_OUTPUT"
          python3 -I scripts/fetch-cache work/source --id "$cache_id"
          python3 -I scripts/fetch-tile-keys work/candidate/pin.json work/source/keys.json
      - uses: actions/cache@v4
        with:
          path: |
            work/inset-topology
            work/inset-raster
          key: inset-cache-${{ steps.cache.outputs.id }}-${{ hashFiles('src/**', 'build.gradle', 'settings.gradle', 'flake.lock') }}
      - name: Build and validate inset candidate
        id: build
        run: |
          generator=$(git log -1 --format=%H -- src scripts data build.gradle settings.gradle flake.nix flake.lock)
          nix develop -c scripts/build-insets --cache work/source/cache --xteas work/source/keys.json \
            --pin work/candidate/pin.json --transports planner/tooling/shortest-path/src/main/resources/transports \
            --commit "$generator" --output work/insets
          manifest=$(find work/insets -mindepth 2 -maxdepth 2 -name manifest.json)
          test -n "$manifest"
          python3 scripts/compare-insets "$manifest" planner/tiles.json > work/geometry-review
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          jq '{version,tileVersion,componentCount,namingReviewCount}' "$manifest" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: nix develop -c scripts/upload-insets "$(dirname '${{ steps.build.outputs.manifest }}')"
      - uses: actions/upload-artifact@v4
        with:
          name: inset-review
          path: work/insets/*/review.json
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: collisionlab
          repositories: |
            osrs-planner
            osrs-coord-preview
      - name: Pin validated pair
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh auth setup-git
          # The PR is a draft exactly while a person needs to check something: big tile or inset
          # changes, the first insets, or reachable areas without a name. pin-insets lists them.
          python3 -I scripts/tile-review work/candidate/pin.json work/pinned.json > work/tile-review.json
          flags=(--tile-review work/tile-review.json --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if ! jq -e '.insets != null' work/pinned.json >/dev/null; then
            flags+=(--first-insets)
          elif [ "$(cat work/geometry-review)" = true ]; then
            flags+=(--geometry-review)
          fi
          python3 -I scripts/pin-insets work/candidate/pin.json '${{ steps.build.outputs.manifest }}' "${flags[@]}"
