name: routing-layers
on:
  workflow_dispatch:
    inputs:
      tileVersion:
        description: Compatible published terrain release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: routing-layer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Skretzo/shortest-path
          path: plugin
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Fetch and verify the pinned collision release
        env:
          TILE_VERSION: ${{ inputs.tileVersion }}
        run: python3 scripts/fetch-routing-collision https://tiles.collisionlab.world "$TILE_VERSION" work/collision
      - name: Test and generate using the pinned production implementation
        env:
          TILE_VERSION: ${{ inputs.tileVersion }}
        run: |
          nix develop -c gradle :routing-layers:test routingLayers -ProutingPluginDir="$PWD/plugin" \
            -ProutingCollisionDir=work/collision -ProutingTileVersion="$TILE_VERSION" -ProutingOutput=work/routing-layers
      - name: Publish immutable sidecar, manifest last
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: nix develop -c bash -c 'for candidate in work/routing-layers/*; do scripts/upload-routing-layers "$candidate"; done'
      - uses: actions/upload-artifact@v4
        with:
          name: routing-layer-manifest
          path: work/routing-layers/*/manifest.json
