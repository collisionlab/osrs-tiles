name: coordinate-preview-consumer
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Released Action repository
        type: choice
        options: [collisionlab/osrs-coord-preview, collisionlab/osrs-coord-preview-action]
        default: collisionlab/osrs-coord-preview
      revision:
        description: Released Action tag or full commit
        required: true
      public_api:
        description: Also exercise the deployed preview API (after approved route activation)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  released-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.revision }}
          path: preview-action
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Execute renderer-repository bundle test
        if: inputs.repository == 'collisionlab/osrs-coord-preview'
        working-directory: preview-action
        run: node --test test/action.test.mjs
      - name: Start controlled renderer fixture
        run: |
          python3 -u - <<'PYTHON' > "$RUNNER_TEMP/action-fixture.log" 2>&1 &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')
              def do_POST(self):
                  assert self.path == '/render'
                  body = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                  assert body == [{'coordinate': '3200/3200/0', 'id': 'smoke'}]
                  self.send_response(200)
                  self.send_header('content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'renderCount': 1, 'failedCount': 0, 'items': [{
                      'status': 'success', 'id': 'smoke', 'coordinate': '3200/3200/0',
                      'resolved': {'tileX': 35, 'tileY': 31, 'pixelX': 2, 'pixelY': 254},
                      'imageUrl': 'https://example.invalid/controlled-fixture.png'
                  }]}).encode())
          HTTPServer(('127.0.0.1', 8080), Handler).serve_forever()
          PYTHON
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/health
      - name: Run the released Action through GitHub's Action loader
        id: smoke
        uses: ./preview-action
        with:
          coordinates: '[{"coordinate":"3200/3200/0","id":"smoke"}]'
          renderer-url: http://127.0.0.1:8080/render
          output-dir: released-preview
      - name: Check released Action outputs
        env:
          COUNT: ${{ steps.smoke.outputs.render_count }}
          MANIFEST: ${{ steps.smoke.outputs.manifest_path }}
          COMMENT_BODY: ${{ steps.smoke.outputs.comment_body_path }}
          SUMMARY: ${{ steps.smoke.outputs.summary_path }}
          ACTION_REPOSITORY: ${{ inputs.repository }}
        run: |
          test "$COUNT" = 1
          jq -e '.items[0].status == "success" and .items[0].id == "smoke"' "$MANIFEST"
          if [ "$ACTION_REPOSITORY" = collisionlab/osrs-coord-preview-action ]; then
            test -s "$COMMENT_BODY"
            test -s "$SUMMARY"
            head -n 1 "$COMMENT_BODY" | grep -Fx '<!-- osrs-coordinate-preview -->'
          fi
  external-action:
    needs: released-package
    if: inputs.public_api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.revision }}
          path: preview-action
      - name: Run released Action without installing dependencies
        uses: ./preview-action
        with:
          coordinates: '[{"coordinate":"3222/3218/0","id":"lumbridge"},{"coordinate":"3222/3218/1","id":"upper-floor"}]'
      - name: Verify manifest and public PNG
        run: |
          test "$(jq .renderCount .osrs-coordinate-preview/manifest.json)" = 2
          jq -r '.items[].imageUrl' .osrs-coordinate-preview/manifest.json | while read -r url; do
            curl --fail --silent --show-error "$url" -o preview.png
            test "$(file --mime-type -b preview.png)" = image/png
          done
