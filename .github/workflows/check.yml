name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: collisionlab
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Re-render every example and compare hashes
        run: nix develop -c scripts/check-golden
      # Renderer tests that read the cache check-golden fetched (the insets job skips them).
      - name: Cache-backed renderer tests
        run: nix develop -c gradle test

  insets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Python inset tests
        run: nix develop -c python3 -m unittest discover -s tests
      - name: Compile cache extractor, renderer and collision dumper
        run: nix develop -c gradle test compileCollisionJava
