plugins {
    id 'java'
}

// The production plugin, at the commit plugin.json pins, compiled from its own sources. Its RuneLite
// client stays on this project's classpath, apart from the renderer's cache library.
// -ProutingPluginRevision builds another commit (scripts/build-routing-layers passes the planner's).
def pin = new groovy.json.JsonSlurper().parse(file('plugin.json'))
if (providers.gradleProperty('routingPluginRevision').isPresent()) {
    pin.revision = providers.gradleProperty('routingPluginRevision').get()
}
def effectivePin = layout.buildDirectory.file('pin/plugin.json')

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex('net\\.runelite.*')
        }
    }
    mavenCentral()
}

dependencies {
    implementation "net.runelite:client:${pin.runeLiteVersion}"
    implementation 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'junit:junit:4.13.2'
}

def archive = layout.buildDirectory.file('plugin.tar')
def unpacked = layout.buildDirectory.dir('plugin')

// Archive a commit, never a working tree, so local edits and untracked files can't change the input.
// The checkout is -ProutingPluginDir, else ../../shortest-path, else the pinned commit fetched here.
tasks.register('resolvePlugin', Exec) {
    def local = rootProject.file('../../shortest-path')
    def supplied = providers.gradleProperty('routingPluginDir')
    def checkout = supplied.orElse(local.isDirectory() ? local.path : layout.buildDirectory.dir('checkout').get().asFile.path)
    inputs.property('revision', pin.revision)
    inputs.property('repository', pin.repository)
    outputs.file archive
    doFirst {
        archive.get().asFile.parentFile.mkdirs()
        if (!file(checkout.get()).isDirectory()) {
            if (supplied.isPresent()) {
                throw new GradleException('routingPluginDir must be an existing plugin checkout')
            }
            file(checkout.get()).mkdirs()
            providers.exec {
                commandLine 'git', 'init', '-q', checkout.get()
            }.result.get().assertNormalExitValue()
            providers.exec {
                commandLine 'git', '-C', checkout.get(), 'fetch', '--quiet', '--depth=1',
                    "https://github.com/${pin.repository}.git", pin.revision
            }.result.get().assertNormalExitValue()
        }
    }
    commandLine 'git', '-C', checkout.get(), 'archive', pin.revision, '--output', archive.get().asFile
}

tasks.register('unpackPlugin', Sync) {
    dependsOn 'resolvePlugin'
    from { tarTree(archive.get()) }
    into unpacked
}

sourceSets.main.java.srcDir unpacked.map { it.dir('src/main/java') }
sourceSets.main.resources.srcDir unpacked.map { it.dir('src/main/resources') }

tasks.named('compileJava') {
    dependsOn 'unpackPlugin'
}

// The manifest's plugin block is this resource, so it names the commit actually built.
tasks.register('writePluginPin') {
    inputs.property('pin', groovy.json.JsonOutput.toJson(pin))
    outputs.file effectivePin
    doLast {
        effectivePin.get().asFile.parentFile.mkdirs()
        effectivePin.get().asFile.text = groovy.json.JsonOutput.toJson(pin)
    }
}

tasks.named('processResources') {
    dependsOn 'unpackPlugin', 'writePluginPin'
    from(effectivePin)
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(11)
    options.encoding = 'UTF-8'
}

//   gradle routingLayers -ProutingCollisionDir=… -ProutingTileVersion=… -ProutingOutput=…
tasks.register('generate', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mapstyle.routing.RoutingLayers'
    jvmArgs '-Xmx12g'
    doFirst {
        for (name in ['routingCollisionDir', 'routingTileVersion', 'routingOutput']) {
            if (!providers.gradleProperty(name).isPresent()) {
                throw new GradleException("Missing -P${name}; see docs/routing-layers.md")
            }
        }
        args rootProject.file(providers.gradleProperty('routingCollisionDir').get()),
            providers.gradleProperty('routingTileVersion').get(),
            rootProject.file(providers.gradleProperty('routingOutput').get())
    }
}
