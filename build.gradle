plugins {
    id 'java'
    id 'application'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

// Pinned, unlike the tooling's latest.release: StyledMapImageDumper is a
// fork of this exact version's MapImageDumper, and the standard style is
// checked pixel-for-pixel against the unforked class.
def runeLiteVersion = '1.13.2'

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation group: 'net.runelite', name: 'cache', version: runeLiteVersion
    // The cache POM publishes these as runtime-only; the fork and CLI
    // compile against them, at the versions the cache already uses.
    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'com.google.code.gson:gson:2.8.5'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

application {
    mainClass = 'mapstyle.RenderRegions'
    applicationDefaultJvmArgs = [
        '-Xmx4g',
        '-Djava.awt.headless=true',
        // openrs2 disk caches trip thousands of harmless per-archive
        // revision-mismatch warnings; keep the CLI output readable.
        '-Dorg.slf4j.simpleLogger.log.net.runelite.cache.fs.Archive=error',
    ]
}

// `run` resolves relative paths against the caller's directory, not
// map-style/, so `./gradlew -p map-style run --args='--out build/x'`
// behaves like a normal CLI.
tasks.named('run') {
    workingDir = providers.environmentVariable('PWD').orElse(rootDir.path).get()
}

// Whole-map tiles in the route planner's (Explv's) layout; see Tiles.java.
//   gradle tiles --args='--cache work/cache --xteas work/keys.json --out work/tiles'
tasks.register('tiles', JavaExec) {
    description = 'Writes map tiles in the Explv/planner layout.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mapstyle.Tiles'
    jvmArgs = application.applicationDefaultJvmArgs
    workingDir = providers.environmentVariable('PWD').orElse(rootDir.path).get()
}

// Terrain extraction is a real CLI: exceptions fail the sidecar build.
tasks.register('insetTopology', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mapstyle.InsetTopology'
    jvmArgs = application.applicationDefaultJvmArgs
}

// The plugin's collision map generator, compiled from the tooling source the flake pins
// (COLLISION_DUMPER_SRC) against this build's RuneLite cache library. It writes one file per map
// square, as in the plugin's collision-map.zip.
//   nix develop -c gradle collision --args='--cachedir work/cache --xteapath work/keys.json --outputdir work/collision'
def collisionDumperSrc = providers.environmentVariable('COLLISION_DUMPER_SRC')
sourceSets {
    collision {
        java.srcDirs = collisionDumperSrc.isPresent() ? [collisionDumperSrc.get()] : []
        java.include 'CollisionMapDumper.java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    // Runtime-only in the cache POM, like slf4j above; the version the cache uses.
    collisionImplementation 'commons-cli:commons-cli:1.3.1'
}

tasks.register('collision', JavaExec) {
    description = 'Writes the collision map, one file per map square.'
    doFirst {
        if (!collisionDumperSrc.isPresent()) throw new GradleException('COLLISION_DUMPER_SRC is not set: run inside nix develop')
    }
    classpath = sourceSets.collision.runtimeClasspath
    mainClass = 'net.runelite.cache.CollisionMapDumper'
    jvmArgs = application.applicationDefaultJvmArgs
    workingDir = providers.environmentVariable('PWD').orElse(rootDir.path).get()
}

// Separate project: the plugin's RuneLite client never enters the renderer's cache classpath.
tasks.register('routingLayers') { dependsOn ':routing-layers:generate' }
